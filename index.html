<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>herdrick.github.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #ccc;
      min-height: 100vh;
      padding: 48px 20px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      color: #fff;
      font-size: 1.6rem;
      letter-spacing: 0.3px;
      margin-bottom: 28px;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project {
      background: #16213e;
      border: 1px solid #22304f;
      border-radius: 10px;
      padding: 16px 20px;
    }

    .project h2 {
      color: #fff;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .project .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .project a {
      color: #e94560;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
    }

    .project a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>herdrick.github.io</h1>

    <div class="projects">
      <div class="project">
        <h2>Chaos Game</h2>
        <div class="links">
          <a href="https://herdrick.github.io/chaos-game/chaos-game-3d.html">3D &rarr;</a>
          <a href="https://herdrick.github.io/chaos-game/chaos-game.html">2D &rarr;</a>
        </div>
      </div>

      <div class="project">
        <h2>Entropy &amp; Surprisal Explorer</h2>
        <div class="links">
          <a href="https://herdrick.github.io/entropy-sim/">Open &rarr;</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
